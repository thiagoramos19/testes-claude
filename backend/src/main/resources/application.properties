spring.application.name=unilink
server.port=8080

# Conexao com o MySQL. Os valores depois de ":" sao usados quando o
# back-end roda fora do Docker; dentro do Docker, o docker-compose.yml
# troca o host para "mysql" (o nome do container do banco).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/unilink_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:unilink}
spring.datasource.password=${DB_PASSWORD:unilink}

# Datas no JSON no formato 2026-10-27T19:30:00 (e nao como numero)
spring.jackson.serialization.write-dates-as-timestamps=false
